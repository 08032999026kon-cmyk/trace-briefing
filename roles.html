<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>TRACE｜担当カード</title>
<style>
:root{--ink:#172638;--muted:#5d604f;--line:#d6cfbd;--paper:#fffdf7;--bg:#f1ede2;--red:#a3241c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;line-height:1.7}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}h1{font-size:22px;margin:0 0 4px}.lead{color:var(--muted);font-size:14px;margin:0 0 14px}
.setup{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
label{display:grid;gap:4px;font-size:13px;font-weight:700}select{font:inherit;font-size:15px;padding:9px 10px;border:1px solid #bfb7a2;border-radius:6px;background:#fff}
button{font:inherit;font-size:14px;min-height:44px;padding:8px 16px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#fff;border:1.5px dashed #8b8f80;border-radius:8px;padding:18px 20px;break-inside:avoid}
.card small{color:#8a7346;font-size:12px;font-weight:700;letter-spacing:.08em}.card h2{font-size:26px;margin:2px 0 10px}
.card h3{font-size:13px;margin:12px 0 2px;color:var(--muted)}.card ul{margin:0;padding-left:1.2em;font-size:16px}.card p{margin:0;font-size:14px}
.rhythm{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:14px}
.rhythm b{color:var(--red)}
.err{color:var(--red)}
@media(max-width:640px){.cards{grid-template-columns:1fr}}
@page{size:A4 portrait;margin:12mm}
@media print{body{background:#fff}.no-print{display:none}main{padding:0}.card{min-height:108mm}}
</style></head><body><main>
<div class="no-print"><h1>担当カード（A4・1グループ1枚）</h1><p class="lead">切り分けて、グループの1人に1枚ずつ配ります。担当は「最初に読み始める資料」の目安で、担当外の資料も自由に見られます。3人なら1人が2枚、5人以上なら同じ担当を2人で。</p>
<div class="setup"><label>事件<select id="case"><option value="e1">CASE 01 黒金社長の売上隠し</option><option value="case02">CASE 02 銭守社長の外注費偽装</option><option value="case03">CASE 03 豪田社長のニセ出張</option></select></label><button onclick="print()">印刷する</button></div></div>
<div id="cards" class="cards"></div>
<div class="rhythm">主張ごとに：<b>2分読む → 1人30秒ずつ、見つけたことを話す → 2分相談 → 社長にぶつける1ページを決めて、代表が示す</b>。代表は主張ごとに交代してOK。</div>
</main>
<script src="forms.js"></script><script src="page-data.js"></script><script src="episodes-data.js"></script><script src="story.js"></script>
<script>
(function(){'use strict';
/* 担当の分け方は、ChatGPT版（説明会モードv2）の担当カードを元にした。CASE 02・03は同じ考え方で分けた。 */
const ROLES={
 e1:[['帳簿担当',['売上帳','受注・請求台帳','現金出納帳'],['どんな記録がある？','載っていないことから、何が言える？']],
     ['商品担当',['出荷台帳','納品書・受領控','取消関係書類'],['商品はどう動いた？','出荷と受領は、何が違う？']],
     ['代金担当',['領収書控え','取引先の確認回答'],['誰が、いつ、お金を受け取った？','取引先は何と答えている？']],
     ['処理担当',['請求の操作履歴','社内メール保管記録'],['いつ、誰が、何をした？','操作した人と指示した人は同じ？']]],
 case02:[['帳簿担当',['外注費元帳','支払記録'],['いつ、いくら費用にした？','支払いはいつ、どうなっている？']],
     ['書類担当',['請求書綴り','成果物受領・検収簿'],['請求の中身は何？','成果物は本当に受け取った？']],
     ['相手先担当',['外注先の確認回答'],['外注先は何と答えている？','請求書や検収簿の内容と合っている？']],
     ['処理担当',['仕訳承認履歴','社内メール保管記録'],['いつ、誰が処理した？','処理した人と指示した人は同じ？']]],
 case03:[['帳簿担当',['旅費交通費元帳','旅行費用の精算明細'],['いつ、いくら費用にした？','何にお金を使っている？']],
     ['書類担当',['出張報告・精算書','訪問予定の確認記録'],['報告書には何と書いてある？','予定と報告は合っている？']],
     ['相手先担当',['手配内容の確認回答'],['手配先は何と答えている？','報告書の内容と合っている？']],
     ['処理担当',['精算書の処理履歴','社内メール保管記録'],['いつ、誰が処理した？','処理した人と指示した人は同じ？']]]};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const G=window.TraceStory,sel=document.getElementById('case'),box=document.getElementById('cards');
function draw(){const id=ROLES[sel.value]?sel.value:'e1';sel.value=id;const ep=G?.episodes.find(e=>e.id===id);
 const titles=new Set((ep?.docs||[]).map(d=>d.title));
 const missing=ROLES[id].flatMap(r=>r[1]).filter(t=>!titles.has(t));
 box.innerHTML=ROLES[id].map(([name,docs,asks],i)=>`<section class="card"><small>担当 ${i+1}　｜　${esc(ep?.title||'')}</small><h2>${esc(name)}</h2><h3>最初に読む資料</h3><ul>${docs.map(d=>`<li>${esc(d)}</li>`).join('')}</ul><h3>グループに伝えること</h3><ul>${asks.map(a=>`<li>${esc(a)}</li>`).join('')}</ul><h3>伝え方</h3><p>「<b>資料名</b>の<b>○ページ目</b>に、○○と書いてある」</p></section>`).join('')+(missing.length?`<p class="err">資料名が見つかりません：${esc(missing.join('、'))}</p>`:'');
 try{history.replaceState(null,'','#'+id)}catch(e){}}
sel.value=location.hash.replace('#','')||'e1';sel.onchange=draw;draw();
window.TraceRoles=ROLES;
})();
</script></body></html>
